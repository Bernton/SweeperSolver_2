<!doctype html>
<html><head><meta charset="utf-8">
<script>
  // Seeded Math.random so old and new solver versions face the same boards
  (function () {
    var params = new URLSearchParams(location.search);
    var seed = Number(params.get("seed") || 1);
    Math.random = function () {
      seed = (seed + 0x6d2b79f5) | 0;
      var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  })();
</script>
<script src="jquery.js"></script>
<script src="site.js"></script>
</head><body>
<form id="options-form"><table><tr>
  <td><label><input type="radio" name="field" checked></label></td><td id="rows"></td><td id="cols"></td><td id="mines"></td>
</tr></table></form>
<input type="checkbox" id="marks">
<div id="game-container"><div id="game"></div></div>
<script>
  var params = new URLSearchParams(location.search);
  var rows = Number(params.get("rows")), cols = Number(params.get("cols")), mines = Number(params.get("mines"));
  document.getElementById("rows").textContent = rows;
  document.getElementById("cols").textContent = cols;
  document.getElementById("mines").textContent = mines;
  var game = new Minesweeper([], function () { return { gameTypeId: 0, numRows: rows, numCols: cols, numMines: mines, zoom: 1 }; }, function () {});
  game.newGame();
</script>
</body></html>
