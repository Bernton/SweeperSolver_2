<!doctype html>
<html><head><meta charset="utf-8">
<script>
  (function () {
    var params = new URLSearchParams(location.search);
    var seed = Number(params.get("seed") || 1);
    Math.random = function () {
      seed = (seed + 0x6d2b79f5) | 0;
      var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  })();
</script>
<script src="jquery.js"></script>
<script src="site.js"></script>
</head><body>
<form id="options-form"><table>
<tr><td><label><input type="radio" name="field" id="std" checked></label></td><td id="rows"></td><td id="cols"></td><td id="mines"></td></tr>
<tr><td><label><input type="radio" name="field" id="custom"></label></td><td><input id="ch" value="20"></td><td><input id="cw" value="30"></td><td><input id="cm" value="145"></td></tr>
</table></form>
<input type="checkbox" id="marks">
<input type="text" id="textbox">
<div id="game-container"><div id="game"></div></div>
<script>
  var params = new URLSearchParams(location.search);
  var rows = Number(params.get("rows")), cols = Number(params.get("cols")), mines = Number(params.get("mines"));
  document.getElementById("rows").textContent = rows;
  document.getElementById("cols").textContent = cols;
  document.getElementById("mines").textContent = mines;
  // Like the site: the next new game reads the options form
  var game = new Minesweeper([], function () {
    if (document.getElementById("custom").checked) return { gameTypeId: 4, numRows: +ch.value, numCols: +cw.value, numMines: +cm.value, zoom: 1 };
    return { gameTypeId: 0, numRows: rows, numCols: cols, numMines: mines, zoom: 1 };
  }, function () {});
  game.newGame();
</script>
</body></html>
